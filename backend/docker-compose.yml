name: tattva

services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - tattva_mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - tattva_redis:/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - tattva_qdrant:/qdrant/storage

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      QDRANT_URL: http://qdrant:6333
      RUN_ANALYSIS_WORKERS: "false"
    ports:
      - "8002:8000"
    volumes:
      - tattva_uploads:/srv/tattva/data/uploads
      - tattva_embeddings:/srv/tattva/data/embedding_cache
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "app.workers.entrypoint"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      QDRANT_URL: http://qdrant:6333
    volumes:
      - tattva_uploads:/srv/tattva/data/uploads
      - tattva_embeddings:/srv/tattva/data/embedding_cache
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  tattva_mongodb:
    external: true
    name: backend_tattva_mongodb
  tattva_redis:
  tattva_qdrant:
    external: true
    name: backend_tattva_qdrant
  tattva_uploads:
    external: true
    name: backend_tattva_uploads
  tattva_embeddings:
    external: true
    name: backend_tattva_embeddings
